<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>채플 출석</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="채플">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* 레이아웃: 가운데 한 컬럼(인사말 → 요약 → 달력) + 왼쪽에 떠 있는 아이콘 툴바(모바일은 하단). 애플 기본 테마. */
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --sub:#6e6e73; --line:rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.72); --fill:rgba(120,120,128,.12); --dim:#c7c7cc; --on-accent:#ffffff;
  --green:#34c759; --red:#ff3b30; --orange:#ff9500; --blue:#007aff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --line:rgba(255,255,255,.1);
    --glass:rgba(44,44,46,.72); --fill:rgba(120,120,128,.24); --dim:#48484a; --on-accent:#ffffff;
    --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --line:rgba(255,255,255,.1);
  --glass:rgba(44,44,46,.72); --fill:rgba(120,120,128,.24); --dim:#48484a; --on-accent:#ffffff;
  --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── 아이콘 툴바 ── */
.toolbar{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:10}
.pill,.fab{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:.5px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.08)}
.pill{border-radius:999px;padding:6px;display:flex;flex-direction:column;gap:2px}
.pill .sep{height:1px;width:24px;background:var(--line);margin:2px auto}
.tb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .15s;-webkit-touch-callout:none;user-select:none}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{width:52px;height:52px;border-radius:50%}
.fab svg{width:24px;height:24px}
@media (hover:hover){
  .tb:hover{background:var(--fill)}
  .tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;padding:5px 9px;border-radius:7px;background:var(--card);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.14);pointer-events:none}
}
.tip{position:fixed;z-index:40;font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;background:var(--card);color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.18);transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .15s}
.tip.show{opacity:1}

/* ── 메인 ── */
main{max-width:920px;margin:0 auto;padding:56px 24px 64px 100px}
.greet{text-align:center;margin-bottom:32px}
.greet h1{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.greet p{margin-top:8px;font-size:17px;color:var(--sub)}
.greet b{color:var(--blue);font-weight:600}
.banner{margin-bottom:16px;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.5;background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
.banner.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.banner.info{background:var(--fill);color:var(--sub)}

.card{background:var(--card);border-radius:18px;border:.5px solid var(--line)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-bottom:16px}
.ringcard{padding:20px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ring{position:relative;width:120px;height:120px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .track{stroke:var(--fill)}
.ring .prog{stroke:var(--green);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center strong{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .center span{font-size:12px;color:var(--sub);margin-top:4px}
.semname{font-size:13px;font-weight:600;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.stat .label{font-size:13px;color:var(--sub)}
.stat .val{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:15px;font-weight:500;color:var(--sub);margin-left:2px}
.stat.warn .val{color:var(--orange)}
.empty{padding:28px 24px;margin-bottom:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:20px;font-weight:700}
.empty p{color:var(--sub);font-size:14px;line-height:1.6;max-width:36ch}
.btn{height:44px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:600}
.btn.primary{background:var(--blue);color:var(--on-accent)}
.btn.ghost{background:var(--fill)}
.btn.danger{background:none;color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}

/* ── 달력 ── */
.cal{padding:20px 20px 12px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cal-head h2{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:6px}
.nav button{height:32px;min-width:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{font-size:12px;color:var(--sub);text-align:right;padding:0 8px 8px}
.grid{border-top:.5px solid var(--line)}
.grid.up{animation:up .45s cubic-bezier(.2,.8,.2,1)}
.grid.down{animation:down .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-32px);opacity:0}to{transform:none;opacity:1}}
.cell{height:96px;border-bottom:.5px solid var(--line);padding:6px 8px;position:relative;display:flex;flex-direction:column;min-width:0}
.cell:not(:nth-child(7n)){border-right:.5px solid var(--line)}
.cell .num{align-self:flex-end;font-size:14px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.out .num,.cell.off .num{color:var(--dim)}
.cell.hol .num{color:var(--red)}
.cell.today .num{background:var(--red);color:var(--on-accent)}
.cell.chapel{cursor:pointer;transition:background .15s}
@media (hover:hover){.cell.chapel:not(.future):hover{background:var(--fill)}}
.cell.future{cursor:default}
.cell .tag{font-size:11px;color:var(--sub);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.hol .tag{color:var(--red)}
.mark{display:flex;align-items:center;gap:6px;margin-top:6px;min-width:0}
.o,.x{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:700;flex:none}
.o{border:2.5px solid var(--green)}
.o.late{border-color:var(--orange)}
.x{color:var(--red);font-size:20px}
.mark .lbl{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl.green{color:var(--green)} .lbl.orange{color:var(--orange)} .lbl.red{color:var(--red)}
.w2{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:var(--blue);color:var(--on-accent)}
.cell.pulse{animation:pulse 1s ease}
@keyframes pulse{0%,100%{background:transparent}40%{background:color-mix(in srgb,var(--blue) 14%,transparent)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);padding:12px 4px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ── 시트 ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{width:100%;max-width:380px;max-height:calc(100% - 32px);overflow:auto;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:15px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field:first-of-type{margin-top:0}
.two{margin-top:14px}
.two .field,h3 + .two{margin-top:0}
.field label,.field .lab{font-size:13px;color:var(--sub);font-weight:500}
.field input{height:42px;border-radius:10px;border:0;background:var(--fill);padding:0 12px;font-size:15px;width:100%;min-width:0}
.field .note{font-size:12px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--orange);margin-top:12px;min-height:18px;line-height:1.5}
.hint.err{color:var(--red)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.placeholder{font-size:14px;color:var(--sub);line-height:1.6}

.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;transition:opacity .3s,transform .3s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 목록(학기·휴강일) ── */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--fill);min-width:0}
.item span{display:flex;flex-direction:column;gap:2px;min-width:0}
.item b{font-weight:600}
.item small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.item.pick.on{box-shadow:inset 0 0 0 2px var(--blue)}
.item em{font-style:normal;font-size:12px;font-weight:600;color:var(--blue);flex:none}
.item .del{color:var(--red);font-size:14px;font-weight:500;padding:6px 8px;flex:none}

/* ── 여러 날 선택 ── */
.cal-head{flex-wrap:wrap}
#btnSelect{margin-right:6px}
#btnSelect.on{background:var(--blue);color:var(--on-accent)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:12px;border:.5px solid var(--line);background:color-mix(in srgb,var(--blue) 8%,transparent)}
.selbar .selcount{font-size:14px;font-weight:600;min-width:64px;font-variant-numeric:tabular-nums}
.selbar .seg{flex:1 1 180px}
.btn.small{height:34px;padding:0 14px;font-size:14px}
.cell.sel{background:color-mix(in srgb,var(--blue) 16%,transparent);box-shadow:inset 0 0 0 2px var(--blue)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ── 모바일 ── */
@media (max-width:720px){
  main{padding:32px 16px 120px}
  .greet h1{font-size:26px}
  .greet p{font-size:15px}
  .toolbar{left:50%;top:auto;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);flex-direction:row}
  .pill{flex-direction:row}
  .pill .sep{width:1px;height:24px;margin:auto 2px}
  .summary{grid-template-columns:1fr}
  .stats{gap:10px}
  .stat{padding:14px}
  .stat .label{font-size:12px}
  .stat .val{font-size:24px}
  .cal{padding:16px 10px 10px}
  .cal-head h2{font-size:22px}
  .cell{height:64px;padding:4px}
  .cell .num{font-size:12px;width:22px;height:22px}
  .mark{justify-content:center;margin-top:2px}
  .mark .lbl,.cell .tag{display:none}
  .o,.x{width:20px;height:20px}
  .o{border-width:2px}
  .x{font-size:16px}
  .w2{left:3px;top:4px;font-size:9px;padding:1px 3px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
}

.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:100}
.login form{width:100%;max-width:340px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:22px;font-weight:700;font-family:var(--font-display)}
.login .field{margin-top:0}
.lgerr{color:var(--red);font-size:13px;min-height:1em}
</style>
</head>
<body>

<nav class="toolbar" aria-label="메뉴">
  <div class="pill">
    <button class="tb" id="btnSemester" data-tip="학기 관리" aria-label="학기 관리">
      <svg viewBox="0 0 24 24"><path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.5v4.5c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5M22 9.5V15"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb" id="btnCancel" data-tip="휴강일 추가" aria-label="휴강일 추가">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9.8 12.8l4.4 4.4M14.2 12.8l-4.4 4.4"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb" id="btnBackup" data-tip="백업 · 복원" aria-label="백업 · 복원">
      <svg viewBox="0 0 24 24"><path d="M8 19V5M4 9l4-4 4 4M16 5v14M12 15l4 4 4-4"/></svg>
    </button>
  </div>
  <button class="tb fab" id="btnToday" data-tip="오늘 출석" aria-label="오늘 출석">
    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </button>
</nav>
<div class="tip" id="tip"></div>

<main>
  <header class="greet">
    <h1 id="hello"></h1>
    <p id="subline">기록을 불러오는 중이에요.</p>
  </header>

  <div id="banners"></div>

  <section class="card empty" id="empty" hidden>
    <h2>이번 학기를 먼저 만들어 주세요</h2>
    <p>학기 시작일과 종료일, 주 등교일수를 정하면 채워야 할 출석 일수가 계산돼요.</p>
    <button class="btn primary" id="emptyCreate">학기 만들기</button>
  </section>

  <section class="summary" id="summary">
    <div class="card ringcard">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="52"/>
          <circle class="prog" id="prog" cx="60" cy="60" r="52"/>
        </svg>
        <div class="center"><strong id="ringNum">–</strong><span id="ringReq">/ – 일</span></div>
      </div>
      <span class="semname" id="semName"></span>
    </div>
    <div class="stats">
      <div class="card stat"><span class="label">남은 필수 출석</span><span class="val" id="sLeft">–</span></div>
      <div class="card stat"><span class="label">남은 채플일 (월~목)</span><span class="val" id="sUpcoming">–</span></div>
      <div class="card stat" id="lateCard"><span class="label">지각</span><span class="val" id="sLate">–</span></div>
    </div>
  </section>

  <section class="card cal">
    <div class="cal-head">
      <h2 id="title"></h2>
      <div class="nav">
        <button id="btnSelect" aria-pressed="false">선택</button>
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="goToday">오늘</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="selbar" id="selbar" hidden>
      <span class="selcount" id="selCount">0일 선택</span>
      <div class="seg" id="selStatus" role="group" aria-label="기록할 상태">
        <button type="button" data-s="present">출석</button><button type="button" data-s="late">지각</button><button type="button" data-s="absent">결석</button>
      </div>
      <button type="button" class="btn ghost small" id="selUnrec">미기록 월~목</button>
      <button type="button" class="btn ghost small" id="selCancel">취소</button>
      <button type="button" class="btn primary small" id="selApply" disabled>적용</button>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="border:2px solid var(--green)"></i>출석</span>
      <span><i style="border:2px solid var(--orange)"></i>지각(출석)</span>
      <span><i style="background:var(--red)"></i>결석 · 지각(결석)</span>
      <span><i style="background:var(--blue);border-radius:3px"></i>2일 인정</span>
    </div>
  </section>
</main>

<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>


<script>
// ───── 기본 설정 ─────
let USER = '';
const REQUIRED_BY_DAYS = { 4: 46 };   // 주 등교일수 → 필수 출석 일수 (1~3, 5일은 나중에 추가)
const LATE_LIMIT = 3;                  // 지각 3회까지 출석 인정, 4회째부터 결석

// 대한민국 공휴일 (대체공휴일 포함). 해가 바뀌면 여기에 추가
const HOLIDAYS = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일',

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = new Date();
const todayKey = key(now);

// ───── 상태 ─────
const state = { ready:false, offline:false, uid:null, active:null, semesters:{}, selecting:false, sel:new Set() };
const sem = () => state.semesters[state.active] || null;

function isChapelDay(k, d){          // 기록할 수 있는 날: 학기 중 평일(월~금), 공휴일·휴강일 제외
  const s = sem(); if (!s) return false;
  const w = d.getDay();
  return w>=1 && w<=5 && k>=s.start && k<=s.end && !HOLIDAYS[k] && !(s.cancelled||{})[k];
}
const isRegularDay = (k, d) => isChapelDay(k, d) && d.getDay()<=4;   // 정규 등교일 월~목

function inRangeRecords(s){
  return Object.entries(s.records||{}).filter(([k]) => k>=s.start && k<=s.end);
}
function lateRanks(s){
  const ranks = {};
  inRangeRecords(s).filter(([,r]) => r.status==='late').map(([k]) => k).sort().forEach((k,i) => ranks[k] = i+1);
  return ranks;
}
function stats(s){
  const ranks = lateRanks(s);
  let earned = 0;
  for (const [k,r] of inRangeRecords(s)) {
    if (r.status==='present' || (r.status==='late' && ranks[k] <= LATE_LIMIT)) earned += r.weight===2 ? 2 : 1;
  }
  let upcoming = 0;
  const from = todayKey > s.start ? parseKey(todayKey) : parseKey(s.start);
  for (let d = from; key(d) <= s.end; d.setDate(d.getDate()+1)) {
    const k = key(d);
    if (isRegularDay(k, d) && !(s.records||{})[k]) upcoming++;
  }
  return { earned, left: Math.max(0, s.required - earned), upcoming, lates: Object.keys(ranks).length };
}

// ───── 인사말 (접속할 때 한 번 정함) ─────
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const GREETINGS = {
  dawn:    ['아직 깨어 있으셨네요!', '조용한 새벽이에요.', '이른 새벽, 오늘도 화이팅이에요!'],
  morning: ['좋은 아침입니다!', '상쾌한 아침이에요!', '오늘 하루도 힘차게 시작해요!', '아침 채플 잊지 마세요!'],
  noon:    ['좋은 오후입니다!', '점심은 맛있게 드셨나요?', '오후도 힘내세요!', '나른한 오후, 조금만 더 힘내요!'],
  evening: ['좋은 저녁입니다!', '오늘 하루도 수고 많으셨어요!', '편안한 저녁 보내세요!', '하루 마무리 잘 하고 계신가요?'],
  night:   ['편안한 밤 보내세요!', '오늘도 고생 많으셨어요!', '푹 쉬고 내일 만나요!']
};
const WEEKDAY_EXTRA = { 1:['새로운 한 주의 시작이에요!'], 4:['이번 주 마지막 채플 날이에요!'], 5:['즐거운 금요일이에요!'], 0:['여유로운 주말 보내세요!'], 6:['여유로운 주말 보내세요!'] };
const HELLO = (() => {
  const h = now.getHours();
  const slot = h<5 ? 'night' : h<7 ? 'dawn' : h<11 ? 'morning' : h<17 ? 'noon' : h<22 ? 'evening' : 'night';
  const extra = (slot==='night' || slot==='dawn') ? [] : (WEEKDAY_EXTRA[now.getDay()] || []);
  return pick([...GREETINGS[slot], ...extra]);
})();
const SUB_IDX = Math.floor(Math.random()*3);
function subline(left){
  if (!left) return ['<b>필수 출석 일수를 모두 채웠어요!</b>', '<b>이번 학기 출석 완료! 수고하셨어요.</b>', '<b>목표 달성! 정말 수고 많으셨어요.</b>'][SUB_IDX];
  return [`필수 출석까지 <b>${left}</b>일 남았습니다.`, `앞으로 <b>${left}</b>일만 더 채우면 돼요.`, `목표 달성까지 <b>${left}</b>일 남았어요.`][SUB_IDX];
}

// ───── 화면 그리기 ─────
function renderSummary(){
  $('hello').textContent = USER ? `${USER}님, ${HELLO}` : HELLO;
  const s = sem();
  const banners = [];
  if (state.offline) banners.push(['info', '']);
  $('empty').hidden = !state.ready || !!s;
  $('summary').hidden = state.ready && !s;
  if (!state.ready) { $('subline').textContent = '기록을 불러오는 중이에요.'; }
  else if (!s) { $('subline').textContent = '이번 학기를 만들면 바로 시작할 수 있어요.'; }
  else {
    const st = stats(s);
    $('subline').innerHTML = subline(st.left);
    const C = 2*Math.PI*52, p = Math.min(1, st.earned / s.required);
    $('prog').style.strokeDasharray = C;
    $('prog').style.strokeDashoffset = C*(1-p);
    $('ringNum').textContent = st.earned;
    $('ringReq').textContent = `/ ${s.required}일`;
    $('semName').textContent = s.name;
    $('sLeft').innerHTML = `${st.left}<small>일</small>`;
    $('sUpcoming').innerHTML = `${st.upcoming}<small>일</small>`;
    $('sLate').innerHTML = `${st.lates}<small>/ ${LATE_LIMIT}</small>`;
    $('lateCard').classList.toggle('warn', st.lates>=LATE_LIMIT);
    if (st.lates===LATE_LIMIT) banners.push(['', '지각 3회예요. 다음 지각부터는 결석으로 처리돼요.']);
    if (st.left > st.upcoming) banners.push(['danger', `남은 채플일(${st.upcoming}일)보다 채워야 할 일수(${st.left}일)가 많아요. 금요일 채플이나 2일 인정 채플을 챙겨 주세요.`]);
  }
  $('banners').innerHTML = banners.map(([c,t]) => `<div class="banner ${c}">${esc(t)}</div>`).join('');
}

let view = { y: now.getFullYear(), m: now.getMonth() };
function renderCal(){
  $('title').textContent = `${view.y}년 ${view.m+1}월`;
  const s = sem();
  const first = new Date(view.y, view.m, 1);
  const start = new Date(view.y, view.m, 1 - first.getDay());
  const ranks = s ? lateRanks(s) : {};
  let html = '';
  for (let i=0; i<42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    if (i>=35 && d.getMonth()!==view.m) break;
    const k = key(d), out = d.getMonth()!==view.m;
    const chapel = isChapelDay(k, d), future = k > todayKey;
    const cls = ['cell', out&&'out', !chapel&&'off', HOLIDAYS[k]&&'hol', k===todayKey&&'today', chapel&&'chapel', chapel&&future&&'future', state.sel.has(k)&&'sel'].filter(Boolean).join(' ');
    let inner = `<span class="num">${d.getDate()}</span>`;
    const r = s && k>=s.start && k<=s.end ? (s.records||{})[k] : null;
    if (r) {
      if (r.weight===2) inner += `<span class="w2">×2</span>`;
      if (r.status==='present') inner += `<div class="mark"><span class="o"></span><span class="lbl green">출석</span></div>`;
      else if (r.status==='absent') inner += `<div class="mark"><span class="x">✕</span><span class="lbl red">결석</span></div>`;
      else if (ranks[k] <= LATE_LIMIT) inner += `<div class="mark"><span class="o late"></span><span class="lbl orange">지각(출석)</span></div>`;
      else inner += `<div class="mark"><span class="x">✕</span><span class="lbl red">지각(결석)</span></div>`;
    }
    if (HOLIDAYS[k]) inner += `<span class="tag">${HOLIDAYS[k]}</span>`;
    else if (s && (s.cancelled||{})[k]) inner += `<span class="tag">${esc(s.cancelled[k])}</span>`;
    html += `<div class="${cls}" data-k="${k}">${inner}</div>`;
  }
  $('grid').innerHTML = html;
}
const renderAll = () => { renderSummary(); renderCal(); };

function go(y, m){
  const dir = (y*12+m) - (view.y*12+view.m);
  view = { y, m };
  renderCal();
  const g = $('grid');
  g.classList.remove('up','down'); void g.offsetWidth;
  if (dir) g.classList.add(dir>0 ? 'up' : 'down');
}
$('prev').onclick = () => go(view.m ? view.y : view.y-1, view.m ? view.m-1 : 11);
$('next').onclick = () => go(view.m<11 ? view.y : view.y+1, view.m<11 ? view.m+1 : 0);
$('goToday').onclick = () => {
  go(now.getFullYear(), now.getMonth());
  const c = $('grid').querySelector(`[data-k="${todayKey}"]`);
  if (c) { c.scrollIntoView({behavior:'smooth', block:'center'}); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }
};

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const openSheet = html => { $('sheet').innerHTML = html; $('backdrop').hidden = false; };
const closeSheet = () => { $('backdrop').hidden = true; };

// ───── 저장 (이 기기의 localStorage) ─────
const LS_KEY = 'chapel.v1';
const clone = o => JSON.parse(JSON.stringify(o));
function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ name: USER, active: state.active, semesters: state.semesters })); }
  catch (e) { toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); }
}
const saveSemester = () => persist();
const saveActive = async () => persist();
function editSemester(fn){                 // 스냅샷은 읽기 전용이라 복사해서 고침
  const id = state.active;
  const s = JSON.parse(JSON.stringify(state.semesters[id]));
  s.records = s.records || {}; s.cancelled = s.cancelled || {};
  fn(s);
  state.semesters = { ...state.semesters, [id]: s };
  renderAll();
  saveSemester(id);
}

// ───── 출석 기록 시트 ─────
function blockedReason(k, d){
  const w = d.getDay(), s = sem();
  if (!s) return '먼저 이번 학기를 만들어 주세요';
  if (w===0 || w===6) return '채플이 없는 날이에요';
  if (HOLIDAYS[k]) return `${HOLIDAYS[k]}(공휴일)이에요`;
  if ((s.cancelled||{})[k]) return '휴강일이에요';
  if (k < s.start || k > s.end) return '학기 기간이 아니에요';
  return '';
}
function openRecord(k){
  const s = sem(), d = parseKey(k);
  const cur = (s.records||{})[k];
  let status = cur ? cur.status : 'present';
  openSheet(`
    <h3>${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})</h3>
    <div class="seg" role="group" aria-label="출석 상태">
      <button data-s="present">출석</button><button data-s="late">지각</button><button data-s="absent">결석</button>
    </div>
    <label class="row" for="w2">2일 인정<input type="checkbox" class="switch" id="w2" ${cur && cur.weight===2 ? 'checked' : ''}></label>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="btn ghost" id="clear">${cur ? '기록 지우기' : '취소'}</button>
      <button class="btn primary" id="save">저장</button>
    </div>`);
  const segs = $('sheet').querySelectorAll('.seg button');
  const others = Object.keys(lateRanks(s)).filter(x => x!==k);
  const lateBefore = others.filter(x => x < k).length;
  const paint = () => {
    segs.forEach(b => { const on = b.dataset.s===status; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const rank = lateBefore + 1;
    $('hint').textContent = status!=='late' ? '' :
      rank > LATE_LIMIT ? `${rank}번째 지각이라 결석으로 처리돼요.` :
      rank === LATE_LIMIT ? '3번째 지각이에요. 다음 지각부터는 결석 처리돼요.' : `${rank}번째 지각이에요. 출석으로 인정돼요.`;
  };
  segs.forEach(b => b.onclick = () => { status = b.dataset.s; paint(); });
  $('save').onclick = () => {
    const weight = $('w2').checked ? 2 : 1;
    editSemester(x => { x.records[k] = { status, weight }; });
    closeSheet();
    toast('저장했어요');
  };
  $('clear').onclick = () => {
    if (cur) { editSemester(x => { delete x.records[k]; }); toast('기록을 지웠어요'); }
    closeSheet();
  };
  paint();
  segs[['present','late','absent'].indexOf(status)].focus();
}

$('grid').onclick = e => {
  const c = e.target.closest('.cell'); if (!c || !state.ready) return;
  const k = c.dataset.k, msg = blockedReason(k, parseKey(k));
  if (msg) return toast(msg);
  if (k > todayKey) return toast('미래 날짜는 기록할 수 없어요');
  if (state.selecting) {
    if (state.sel.has(k)) state.sel.delete(k); else state.sel.add(k);
    updateSelUI(); renderCal();
    return;
  }
  openRecord(k);
};

}

    }
  };
  paint();
}

      </div>
    </div>
    <label class="row" for="bSkip">이미 기록된 날은 건너뛰기<input type="checkbox" class="switch" id="bSkip" checked></label>
    <p class="hint" id="bCount"></p>
    <p class="hint err" id="bErr"></p>
    <div class="actions">
      <button class="btn ghost" id="bCancel">취소</button>
      <button class="btn primary" id="bApply">적용</button>
    </div>`);
  const segs = $('bStatus').querySelectorAll('button');
  const paint = () => {
    segs.forEach(b => { const on = b.dataset.s === status; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const n = targets().length;
    $('bCount').textContent = n ? `${n}일에 적용돼요.` : '적용할 채플일이 없어요.';
  };
  segs.forEach(b => b.onclick = () => { status = b.dataset.s; paint(); });
  $('bFrom').oninput = $('bTo').oninput = $('bSkip').onchange = paint;
  $('bCancel').onclick = closeSheet;
  $('bApply').onclick = () => {
    const f = $('bFrom').value, t = $('bTo').value;
    if (!f || !t) { $('bErr').textContent = '시작일과 끝일을 골라 주세요.'; return; }
    if (f > t) { $('bErr').textContent = '끝일은 시작일보다 뒤여야 해요.'; return; }
    const list = targets();
    if (!list.length) { $('bErr').textContent = '적용할 채플일이 없어요.'; return; }
    editSemester(x => { list.forEach(k => { x.records[k] = { status, weight: 1 }; }); });
    closeSheet();
    toast(`${list.length}일을 기록했어요`);
  };
  paint();
}

// ───── 학기 목록 · 전환 ─────
function gotoSemesterMonth(s){
  const t = todayKey >= s.start && todayKey <= s.end ? now : parseKey(s.start);
  view = { y: t.getFullYear(), m: t.getMonth() };
}
function openSemesterList(){
  const ids = Object.keys(state.semesters).sort((a,b) => state.semesters[b].start.localeCompare(state.semesters[a].start));
  openSheet(`
    <h3>학기</h3>
    <div class="list" id="slList">${ids.map(id => {
      const s = state.semesters[id], on = id === state.active;
      return `<button type="button" class="item pick${on ? ' on' : ''}" data-id="${id}"><span><b>${esc(s.name)}</b><small>${s.start} ~ ${s.end}</small></span>${on ? '<em>현재</em>' : ''}</button>`;
    }).join('')}</div>
    <div class="actions">
      <button class="btn ghost" id="slEdit">현재 학기 수정</button>
      <button class="btn primary" id="slNew">새 학기 만들기</button>
    </div>`);
  $('slEdit').onclick = () => openSemester();
  $('slNew').onclick = () => openSemester(true);
  $('slList').onclick = async e => {
    const b = e.target.closest('.pick'); if (!b) return;
    const id = b.dataset.id;
    closeSheet();
    if (id === state.active) return;
    state.active = id;
    state.selecting = false; state.sel = new Set(); updateSelUI();
    gotoSemesterMonth(state.semesters[id]);
    renderAll();
    toast(`현재 학기: ${state.semesters[id].name}`);
    if (!state.offline) await saveActive(id);
  };
}

// ───── 휴강일 추가 · 삭제 ─────
function openCancel(){
  const s = sem();
  if (!s) return toast('먼저 이번 학기를 만들어 주세요');
  const days = Object.keys(s.cancelled || {}).sort();
  const dflt = todayKey >= s.start && todayKey <= s.end ? todayKey : s.start;
  const label = k => { const d = parseKey(k); return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; };
  openSheet(`
    <h3>휴강일</h3>
    <div class="two">
      <div class="field"><label for="cDate">날짜</label><input type="date" id="cDate" value="${dflt}" min="${s.start}" max="${s.end}"></div>
      <div class="field"><label for="cNote">이름</label><input id="cNote" value="휴강" maxlength="10"></div>
    </div>
    <p class="hint err" id="cErr"></p>
    <button class="btn primary" id="cAdd" style="width:100%">휴강일 추가</button>
    <div class="list" id="cList" style="margin-top:18px">${days.length
      ? days.map(k => `<div class="item"><span><b>${label(k)}</b><small>${esc(s.cancelled[k])}</small></span><button type="button" class="del" data-k="${k}">삭제</button></div>`).join('')
      : '<p class="placeholder">지정한 휴강일이 없어요.</p>'}</div>
    <div class="actions"><button class="btn ghost" id="cClose">닫기</button></div>`);
  $('cClose').onclick = closeSheet;
  $('cAdd').onclick = () => {
    const k = $('cDate').value, note = $('cNote').value.trim() || '휴강';
    const d = k ? parseKey(k) : null;
    const err = !k ? '날짜를 골라 주세요.'
      : (k < s.start || k > s.end) ? '학기 기간 안의 날짜를 골라 주세요.'
      : (d.getDay()===0 || d.getDay()===6) ? '주말은 원래 채플이 없어요.'
      : HOLIDAYS[k] ? `${HOLIDAYS[k]}(공휴일)이라 원래 채플이 없어요.`
      : (s.records||{})[k] ? '이미 출석 기록이 있는 날이에요. 기록을 지운 뒤 지정해 주세요.' : '';
    if (err) { $('cErr').textContent = err; return; }
    editSemester(x => { x.cancelled[k] = note; });
    toast('휴강일을 추가했어요');
    openCancel();
  };
  $('cList').onclick = e => {
    const b = e.target.closest('.del'); if (!b) return;
    editSemester(x => { delete x.cancelled[b.dataset.k]; });
    toast('휴강일을 삭제했어요');
    openCancel();
  };
}

// ───── 여러 날 한 번에 선택 ─────
let selStatus = 'present';
function updateSelUI(){
  $('selbar').hidden = !state.selecting;
  $('btnSelect').classList.toggle('on', state.selecting);
  $('btnSelect').setAttribute('aria-pressed', state.selecting);
  $('selCount').textContent = `${state.sel.size}일 선택`;
  $('selApply').disabled = !state.sel.size;
  $('selStatus').querySelectorAll('button').forEach(b => { const on = b.dataset.s === selStatus; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function exitSelect(){ state.selecting = false; state.sel = new Set(); updateSelUI(); renderCal(); }
$('btnSelect').onclick = () => {
  if (!state.ready) return;
  if (!sem()) return toast('먼저 이번 학기를 만들어 주세요');
  if (state.selecting) return exitSelect();
  state.selecting = true; updateSelUI();
  toast('기록할 날짜를 눌러 고르세요');
};
$('selStatus').onclick = e => { const b = e.target.closest('button'); if (!b) return; selStatus = b.dataset.s; updateSelUI(); };
$('selUnrec').onclick = () => {                      // 보고 있는 달의 기록 안 된 월~목 (오늘까지)
  const rec = sem().records || {};
  const last = new Date(view.y, view.m+1, 0).getDate();
  for (let i = 1; i <= last; i++) {
    const d = new Date(view.y, view.m, i), k = key(d);
    if (k <= todayKey && isRegularDay(k, d) && !rec[k]) state.sel.add(k);
  }
  updateSelUI(); renderCal();
};
$('selCancel').onclick = exitSelect;
$('selApply').onclick = () => {
  const list = [...state.sel]; if (!list.length) return;
  const status = selStatus;
  editSemester(x => {
    list.forEach(k => {
      const keep2 = x.records[k] && x.records[k].weight === 2 && status !== 'absent';
      x.records[k] = { status, weight: keep2 ? 2 : 1 };
    });
  });
  toast(`${list.length}일을 기록했어요`);
  exitSelect();
};

$('btnSemester').onclick = () => { if (!state.ready) return; if (sem()) openSemesterList(); else openSemester(); };
$('emptyCreate').onclick = () => openSemester();

$('btnToday').onclick = () => {
  if (!state.ready) return;
  const msg = blockedReason(todayKey, now);
  if (msg) return toast(sem() ? `오늘은 ${msg}` : msg);
  openRecord(todayKey);
};

// 다음 단계에서 채울 메뉴
const soon = (t, desc) => () => {
  openSheet(`<h3>${t}</h3><p class="placeholder">${desc}</p><div class="actions"><button class="btn ghost" id="ok">닫기</button></div>`);
  $('ok').onclick = closeSheet;
};
$('btnCancel').onclick = () => { if (state.ready) openCancel(); };
$('btnBackup').onclick = () => {
  if (!state.ready) return;
  openSheet(`<h3>백업 · 복원</h3>
    <p class="placeholder">기록은 이 기기의 브라우저에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 꼭 파일로 내보내 두세요. 같은 학기는 불러온 파일 내용으로 덮어써요.</p>
    <div class="actions" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="btn primary" id="bkExport">파일로 내보내기</button>
      <button class="btn ghost" id="bkCopy">내용 복사하기</button>
      <button class="btn ghost" id="bkImport">파일 불러오기</button>
      <textarea id="bkPaste" placeholder="백업 내용을 여기에 붙여넣기" style="height:90px;border-radius:10px;border:0;background:var(--fill);padding:10px 12px;font-size:13px;width:100%;resize:none"></textarea>
      <button class="btn ghost" id="bkPasteBtn">붙여넣은 내용 불러오기</button>
      <button class="btn ghost" id="bkName">이름 바꾸기</button>
      <button class="btn ghost" id="ok">닫기</button>
    </div>
    <input type="file" id="bkFile" accept="application/json,.json" hidden>`);
  $('ok').onclick = closeSheet;
  $('bkExport').onclick = () => {
    const out = { app:'chapel', version:1, exportedAt:new Date().toISOString(), active:state.active, semesters:state.semesters };
    const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `chapel-backup-${todayKey}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('백업 파일을 만들었어요');
  };
  $('bkImport').onclick = () => $('bkFile').click();
  const importJson = async text => {
    try {
      const j = JSON.parse(text);
      if (j.app!=='chapel' || !j.semesters || typeof j.semesters!=='object') throw 0;
      const ids = Object.keys(j.semesters);
      if (!ids.length) throw 0;
      for (const id of ids) {
        const s = j.semesters[id];
        if (!s || !s.name || !s.start || !s.end) throw 0;
        s.records = s.records || {}; s.cancelled = s.cancelled || {};
      }
      state.semesters = { ...state.semesters, ...j.semesters };
      if (!state.semesters[state.active]) state.active = j.semesters[j.active] ? j.active : ids.sort().pop();
      ids.forEach(saveSemester);
      persist();
      renderAll(); closeSheet();
      toast(`${ids.length}개 학기를 불러왔어요`);
    } catch (err) { toast('올바른 백업 내용이 아니에요'); }
  };
  $('bkFile').onchange = async e => { const f = e.target.files[0]; if (f) importJson(await f.text()); };
  $('bkPasteBtn').onclick = () => { const v = $('bkPaste').value.trim(); if (!v) return toast('붙여넣은 내용이 없어요'); importJson(v); };
  $('bkCopy').onclick = async () => {
    const out = { app:'chapel', version:1, exportedAt:new Date().toISOString(), active:state.active, semesters:state.semesters };
    try { await navigator.clipboard.writeText(JSON.stringify(out)); toast('복사했어요'); } catch (e) { toast('복사하지 못했어요. 파일로 내보내 주세요.'); }
  };
  $('bkName').onclick = () => askName();
};

// ───── 아이폰: 아이콘을 길게 누르면 이름 보기 ─────
document.querySelectorAll('.tb[data-tip]').forEach(btn => {
  let timer = null, shown = false;
  btn.addEventListener('touchstart', () => {
    shown = false;
    timer = setTimeout(() => {
      const r = btn.getBoundingClientRect(), tip = $('tip');
      tip.textContent = btn.dataset.tip;
      tip.style.left = `${r.left + r.width/2}px`;
      tip.style.top = `${r.top - 8}px`;
      tip.classList.add('show');
      shown = true;
    }, 450);
  }, { passive: true });
  const end = () => { clearTimeout(timer); setTimeout(() => $('tip').classList.remove('show'), 900); };
  btn.addEventListener('touchend', end);
  btn.addEventListener('touchcancel', end);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', e => { if (shown) { e.stopImmediatePropagation(); e.preventDefault(); shown = false; } }, true);
});

// ───── 시작: 이 기기에서 불러오기 ─────
function askName(){
  openSheet(`<h3>이름을 알려 주세요</h3>
    <p class="placeholder">인사말에 쓰여요. 나중에 백업 · 복원 창에서 바꿀 수 있어요.</p>
    <div class="field"><label for="nmIn">이름</label><input id="nmIn" maxlength="10" value="${esc(USER)}" autocomplete="off"></div>
    <div class="actions"><button class="btn primary" id="nmOk">확인</button></div>`);
  $('nmIn').focus();
  const done = () => { USER = $('nmIn').value.trim().slice(0, 10); persist(); renderAll(); closeSheet(); };
  $('nmOk').onclick = done;
  $('nmIn').onkeydown = e => { if (e.key === 'Enter') done(); };
}
(function(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (saved) {
    USER = saved.name || '';
    state.semesters = saved.semesters || {};
    state.active = saved.active;
  }
  if (!state.semesters[state.active]) {
    const ids = Object.keys(state.semesters).sort();
    state.active = ids.length ? ids[ids.length-1] : null;
  }
  state.ready = true;
  renderAll();
  const s0 = sem(); if (s0) { gotoSemesterMonth(s0); renderAll(); }
  if (!saved || !saved.name) askName();
})();
</script>
</body>
